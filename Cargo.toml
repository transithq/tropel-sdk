[package]
name = "tropel-sdk"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/transithq/tropel-sdk"
rust-version = "1.85"
readme = "README.md"
keywords = ["load-testing", "testing", "adapter", "sdk", "benchmark"]
categories = ["development-tools::testing"]
description = """
Stable public API for Tropel extension authors. Re-exports the types and
traits needed to implement input adapters, protocols, and outputs without
depending on internal crate details.
"""

# ── Semver policy ──────────────────────────────────────────────────
# tropel-sdk follows semver strictly. Any breaking change to re-exported
# types or traits requires a major version bump.
#
# This is the split of the tropel monorepo (transithq/tropel) carrying the
# SDK as a LEAF with zero tropel-* dependencies. In the monorepo,
# tropel-core and tropel-ext are its dependents.
#
# Until 1.0.0, breaking changes bump the minor version (0.x → 0.y).

# ── Features ──────────────────────────────────────────────────────
# Protocol and Output are gated behind feature flags so a consumer that
# only writes input adapters never pays for (or is confused by) the
# extension traits. They ARE wired into engine dispatch (Protocol via
# the URL-scheme registry, Output from the sample stream); the flag just
# controls whether the SDK re-exports them. Breaking changes to these
# traits only require a minor version bump (pre-1.0) or a patch (post-1.0).
#
# `registration` (on by default) enables the `*Registration` structs and
# the `inventory` dependency. A consumer that only writes adapters against
# the traits can set default-features = false and drop inventory entirely.
[features]
default = ["registration"]
registration = ["dep:inventory"]
unstable-protocol = []
unstable-output = []

[dependencies]
# This crate is a LEAF: it must not depend on any tropel-* crate.
# The contract types/traits live here directly (see src/).
inventory = { version = "0.3.24", optional = true }
async-trait = "0.1.91"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
simd-json = { version = "0.17.3", features = ["serde_impl"] }
rustc-hash = "2.1.3"
thiserror = "2.0.19"

[dev-dependencies]
# Used to validate `wit/adapter.wit` resolves (keeps the WIT contract honest).
wit-parser = "0.255.0"
